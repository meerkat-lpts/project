# Builds the website from docs/ and publishes it to the gh-pages branch on every push to main.
# One-off setup on GitHub: Settings -> Pages -> Source: "Deploy from a branch", branch "gh-pages", folder "/ (root)".
name: docs
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: mkdocs gh-deploy --force
